  .dim .note{font-size:12.5px;color:var(--sub);margin-top:6px;text-align:left}
  .legend{font-size:11.5px;color:#94a3b8;margin-top:16px;line-height:1.7}
  .hidden{display:none}

  .block{text-align:left;margin:16px 0;padding-top:14px;border-top:1px dashed var(--line)}

const OPP = {E:"I",I:"E",S:"N",N:"S",T:"F",F:"T",J:"P",P:"J"};
const LABELS = ["很不符","不符","中立","符合","很符合"];
const KEY = "mbti_answers_v1";

let answers = loadAnswers();

function loadAnswers(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; }
}
function saveAnswers(){ try{ localStorage.setItem(KEY, JSON.stringify(answers)); }catch(e){} }

function render(){
  const box = document.getElementById('qlist');
  box.innerHTML = Q.map((q,i)=>{
    const cur = answers[i];
    const opts = LABELS.map((lab,k)=>{
      const v=k+1; const on = (cur===v)?'on':'';
      return '<button class="'+on+'" onclick="pick('+i+','+v+')">'+lab+'</button>';
    }).join('');
    return '<div class="q"><div class="qt"><span class="qno">'+(i+1)+'.</span>'+q.q+'</div><div class="opts">'+opts+'</div></div>';
  }).join('');
  updateProgress();
}
function pick(i,v){
  answers[i]=v; saveAnswers(); render(); updateProgress();
}
function updateProgress(){
  const n = Object.keys(answers).length;
  document.getElementById('progBar').style.width = (n/Q.length*100)+'%';
  document.getElementById('progTxt').textContent = n;
  document.getElementById('goBtn').disabled = (n < Q.length);
}
function resetAll(){
  answers = {}; saveAnswers(); render();
  document.getElementById('resultBox').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}
function compute(){
  const sc = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  Q.forEach((q,i)=>{
    const v = answers[i]; if(!v) return;
    sc[q.p]+=v; sc[OPP[q.p]]+=(6-v);
  });
  const type =
    (sc.E>=sc.I?'E':'I')+(sc.S>=sc.N?'S':'N')+
    (sc.T>=sc.F?'T':'F')+(sc.J>=sc.P?'J':'P');
  const pct = {
    E: Math.round(sc.E/(sc.E+sc.I)*100),
    S: Math.round(sc.S/(sc.S+sc.N)*100),
    T: Math.round(sc.T/(sc.T+sc.F)*100),
    J: Math.round(sc.J/(sc.J+sc.P)*100)
  };
  return {type,pct,sc};
}

const DIMNOTE = {
  E:"外向（E）：从与人互动中获得能量；内向（I）：从独处中恢复精力。",
  S:"实感（S）：关注具体事实与当下；直觉（N）：关注可能性与未来。",
  T:"思考（T）：依据逻辑与客观；情感（F）：依据价值与他人感受。",
  J:"判断（J）：喜欢计划与结论；知觉（P）：喜欢灵活与开放。"
};
function showResult(){
  if(Object.keys(answers).length < Q.length){ alert('还有题目未作答'); return; }
  const {type,pct} = compute();
  const dims = [
    {a:"E",b:"I",v:pct.E,n:DIMNOTE.E},
    {a:"S",b:"N",v:pct.S,n:DIMNOTE.S},
    {a:"T",b:"F",v:pct.T,n:DIMNOTE.T},
    {a:"J",b:"P",v:pct.J,n:DIMNOTE.J}
  ];
  const dimHtml = dims.map(d=>{
    const left = d.v, right = 100-d.v;
    const leftName = d.a, rightName = d.b;
    return '<div class="dim"><div class="row"><span>'+leftName+' '+left+'%</span><span>'+right+'% '+rightName+'</span></div>'+
      '<div class="track"><i class="fill" style="width:'+left+'%"></i></div>'+
      '<div class="note">'+d.n+'</div></div>';
  }).join('');
  const box = document.getElementById('resultBox');
  const p = PROFILE[type];
  const guideHtml = '<ul class="guide">'+p.guide.map(g=>'<li>'+g+'</li>').join('')+'</ul>';
  box.innerHTML =
    '<div class="type">'+type+'</div>'+
    '<div class="nick">'+type+' · '+p.nick+'</div>'+
    '<div class="desc">'+p.desc+'</div>'+
    '<div class="block"><h3>性格详细介绍</h3><p>'+p.intro+'</p></div>'+
    dimHtml+
    '<div class="block"><h3>结果解析 · 你的优势与盲区</h3>'+
      '<p class="pos"><b>优势：</b>'+p.strength+'</p>'+
      '<p class="neg"><b>需要留意：</b>'+p.blind+'</p></div>'+
    '<div class="block"><h3>人生与生活指导</h3>'+guideHtml+'</div>'+
    '<div class="legend">百分比表示该倾向的相对强弱，越接近 50% 说明两种偏好越均衡。本测试为自设计量表，仅供自我探索参考，非临床或官方认证工具。</div>';
  box.classList.remove('hidden');
  document.getElementById('quiz').classList.add('hidden');
  box.scrollIntoView({behavior:'smooth',block:'start'});
}
