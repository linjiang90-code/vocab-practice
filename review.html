<script>
const REVIEW_DATA = [{"id": 1, "en": "Where is the nearest subway station?", "zh": "最近的地铁站在哪里？", "category": "交通/问路", "theme": "travel", "mastery": 0, "introducedDay": 1, "keyvocab": [{"term": "subway", "ipa": "/ˈsʌbweɪ/", "pos": "n.", "zh": "地铁"}, {"term": "station", "ipa": "/ˈsteɪʃən/", "pos": "n.", "zh": "车站"}], "enh": {"fullIpa": "/wɛr ɪz ðə ˈnɪrɪst ˈsʌbweɪ ˈsteɪʃən/", "variants": [["Where's the nearest metro station?", "更口语，metro 在欧陆常用"], ["Which way to the subway?", "极简指路问法"]], "scenes": [["问路人/酒店前台", "Where's the nearest subway station?", "对方指路或说 Go straight and turn left."], ["请对方在地图上标", "Can you pin the station on my map?", "对方帮你定位"], ["分不清地铁叫法", "Is it the tube or the metro here?", "英式 tube / 美式 subway / 欧陆 metro"]], "grammar": "nearest 是 near 的最高级，the nearest + 名词 = 最近的…。subway（美）/ underground（英）/ metro（欧陆）同义，到当地用当地词更地道。", "pron": "连读：Where is→/wɛə rɪz/（r 与 ɪ 连读）；is the→/ɪ zðə/（z 与 ð 连读）；the nearest 元音顺接。同化/滑音：无典型。弱读：is→/z/（功能词弱读省 /ɪ/）；the→/ðə/（弱读）。浊化：无（句首 Where 后接元音，无清→浊语境）。失去爆破/闪音：本句无（注：含 good boy/sit down 等相邻爆破音标失去爆破；含 better/water/party/city 等元音间 /t/ 标闪音 /ɾ/）。缩读：无。"}}, {"id": 2, "en": "Could you say that again, please?", "zh": "你能再说一遍吗？", "category": "沟通/没听清", "theme": "daily", "mastery": 0, "introducedDay": 1, "keyvocab": [{"term": "again", "ipa": "/əˈɡɛn/", "pos": "adv.", "zh": "再，又一次"}, {"term": "say", "ipa": "/seɪ/", "pos": "v.", "zh": "说"}], "enh": {"fullIpa": "/kʊd ju seɪ ðæt əˈɡɛn pliz/", "variants": [["Say that again?", "轻松，朋友间"], ["What? / Huh?", "很随意，仅限熟人，慎对长辈/客户"], ["Come again?", "地道口语，偏英式"]], "scenes": [["英式日常", "Sorry? / Pardon?", "英式最地道，朋友间"], ["美式日常", "Excuse me? / What was that?", "美式更自然，不易误会"], ["职场/客服", "Could you repeat that, please?", "比 say again 更职业"], ["电话听不清", "Sorry, I didn't catch that. / You're breaking up.", "信号差时"]], "grammar": "Could you + 动词原形 比 Can you 更礼貌（could 表委婉，不是过去式）。say 过去式是 said，但 say that again 用原形；again 重音在第二音节 /əˈɡɛn/。", "pron": "同化：Could you→/kʊdʒu/（d+j 同化为 dʒ，关键！）。连读：that again→/ðæ təˈɡɛn/（t 与 a 连读）。浊化：that again 快读 t→d：/ðæ dəˈɡɛn/。弱读：you 此处因同化保留 /ju/，弱读时可作 /jə/。失去爆破/闪音：无典型。缩读：无。"}}, {"id": 3, "en": "I'd like to book a table for two.", "zh": "我想订一张两人桌。", "category": "餐厅/预订", "theme": "travel", "mastery": 1, "introducedDay": 1, "keyvocab": [{"term": "book", "ipa": "/bʊk/", "pos": "v.", "zh": "预订"}, {"term": "table", "ipa": "/ˈteɪbəl/", "pos": "n.", "zh": "餐桌"}], "enh": {"fullIpa": "/aɪd laɪk tə bʊk ə ˈteɪbəl fɔr tu/", "variants": [["I'd like to reserve a table for two.", "reserve 更正式，餐厅常用"], ["Table for two, please.", "极简，前台直接说"]], "scenes": [["电话订位", "I'd like to book a table for two at 7.", "加时间；对方回 Sure, window or inside?"], ["现场有没有位", "Do you have a table for two?", "对方回 It's fully booked.(满座) / Your name, please?"], ["等位", "Can we put our name down?", "留名等位"]], "grammar": "I'd like to… = I would like to…，比 I want 礼貌，点单/预订万能句。book/reserve 在餐厅酒店都表预订；for two 表两人份。", "pron": "连读：like to→/laɪk tə/（可连成 /laɪktə/）；book a→/bʊ kə/（k 与 a 连读）；table for→/ˈteɪbə wɔr/（l 后加 w 滑音）。滑音：table for 中 /l/ 与 /ɔ/ 间插入 /w/。弱读：to→/tə/、a→/ə/、for→/fər/（功能词均弱读）。缩读：I'd = I would（/aɪd/，'d 为 would 缩读）。浊化：like to 快读 t→d：/laɪ də/。失去爆破：无（无爆破音相邻）。闪音：无。"}}, {"id": 4, "en": "It's nice to meet you.", "zh": "很高兴认识你。", "category": "寒暄/初次见面", "theme": "daily", "mastery": 1, "introducedDay": 1, "keyvocab": [{"term": "nice", "ipa": "/naɪs/", "pos": "adj.", "zh": "高兴的"}, {"term": "meet", "ipa": "/mit/", "pos": "v.", "zh": "认识，遇见"}], "enh": {"fullIpa": "/ɪts naɪs tə miːt ju/", "variants": [["Nice to meet you.", "省略 It's，最常用"], ["Great to meet you.", "更热情"], ["Pleasure to meet you.", "偏正式/商务"]], "scenes": [["初次见面", "Nice to meet you.", "对方回 Nice to meet you too."], ["经人介绍", "This is my friend Tom. — Nice to meet you, Tom.", "带名字更自然"], ["道别时", "Hope to see you again.", "期待再见"]], "grammar": "It's + adj. + to do 是形式主语结构；meet 过去式 met，但寒暄用原形 meet。回句固定加 too（也很高兴认识你）。", "pron": "同化：meet you→/miː tʃu/（t+j 同化为 tʃ，关键！）。连读：It's nice→/ɪ tsnaɪs/（ts 连读）；nice to→/naɪs tə/（s 与 t 连读）；to meet→/tə wmiːt/（加 w 滑音）。滑音：to meet 中 /tə/ 与 /miːt/ 间插入 /w/。弱读：to→/tə/；you 句末常弱读 /ju/（此处保留）。缩读：It's = It is（/ɪts/，'s 为 is 缩读）。浊化：无典型。失去爆破/闪音：无典型。"}}, {"id": 5, "en": "How much does this cost?", "zh": "这个多少钱？", "category": "购物/问价", "theme": "travel", "mastery": 1, "introducedDay": 1, "keyvocab": [{"term": "cost", "ipa": "/kɔst/", "pos": "v.", "zh": "花费，价格为"}, {"term": "much", "ipa": "/mʌtʃ/", "pos": "adv.", "zh": "多少"}], "enh": {"fullIpa": "/haʊ mʌtʃ dʌz ðɪs kɔst/", "variants": [["How much is this?", "最简，口语最常用"], ["What's the price?", "偏正式"], ["How much are these?", "复数/多个时"]], "scenes": [["砍价前问价", "How much is it?", "对方报价，可接 That's a bit much.(有点贵)"], ["问单位价", "How much per kilo / each?", "按斤/个计价"], ["自由市场", "Is the price negotiable?", "问能否议价"]], "grammar": "How much + do/does + 主语 + cost? cost 此处作动词花费；this 单数用 does。口语更常省去 cost 直接说 How much is this?", "pron": "连读：How much→/haʊ mʌtʃ/（w 与 m 连读）；much does→/mʌtʃ dʌz/（tʃ 与 d）；does this→/dʌz ðɪs/（z 与 ð）。弱读：does→/dʌz/（弱读形式 /dəz/）；this 此处重读 /ðɪs/。浊化：this cost 中 s 后接清 k，保持清音（无浊化）。失去爆破/闪音：无典型（注：含 that thing / hot day 等相邻爆破或 /t/+/θ/ 时标失去爆破）。缩读：无。"}}, {"id": 6, "en": "What do you usually do on weekends?", "zh": "你周末通常做什么？", "category": "闲聊/周末", "theme": "daily", "mastery": 1, "introducedDay": 2, "keyvocab": [{"term": "usually", "ipa": "/ˈjuʒuəli/", "pos": "adv.", "zh": "通常"}, {"term": "weekends", "ipa": "/ˈwikɛndz/", "pos": "n.", "zh": "周末"}], "enh": {"fullIpa": "/wʌt du ju ˈjuːʒuəli du ɑːn ˈwiːkendz/", "variants": [["What do you do on weekends?", "省掉 usually，依然自然"], ["Any plans for the weekend?", "更偏闲聊，直接问有没有安排"], ["How do you usually spend your weekends?", "稍正式，spend 表『度过』"]], "scenes": [["破冰闲聊", "What do you usually do on weekends?", "对方答 I usually… / Not much.(没啥特别的)"], ["约人出去", "Do you wanna hang out this weekend?", "wanna = want to，问要不要一起玩"], ["不同回答", "I just chill at home. / I go hiking. / Work, unfortunately.", "宅家 / 去徒步 / 无奈要加班"]], "grammar": "一般现在时表习惯性动作；usually 放在主语和实义动词之间（do you usually do）。weekend 英式常用 at weekends，美式用 on weekends。", "pron": "同化：do you→/dʒu/（d+j 同化为 dʒ，关键！）。连读：What do→/wʌ dʊ/（t 与 d 连读）；do on→/dʊ wɑn/（元音间加 w 滑音）；on weekends→/ɑːn ˈwiːkendz/（n 与 w 连读）。浊化：What do 快读 /wʌ dʊ/（t→d，极典型）；usually do 顺接 /ˈjuːʒuəli dʊ/。弱读：you 弱读 /jə/（亦可保留 /ju/）；do 作助动词弱读 /də/；on→/ən/。缩读：场景里 wanna = want to（口语缩读）。失去爆破/闪音：本句无典型（参考：better→/bɛɾɚ/、city→/sɪɾi/ 元音间 /t/ 标闪音；good boy→/ɡʊ bɔɪ/ 相邻爆破音标失去爆破）。"}}, {"id": 7, "en": "Is breakfast included in the price?", "zh": "房价包含早餐吗？", "category": "酒店/预订", "theme": "travel", "mastery": 1, "introducedDay": 2, "keyvocab": [{"term": "breakfast", "ipa": "/ˈbrɛkfəst/", "pos": "n.", "zh": "早餐"}, {"term": "included", "ipa": "/ɪnˈkludɪd/", "pos": "adj.", "zh": "包含在内的"}], "enh": {"fullIpa": "/ɪz ˈbrekfəst ɪnˈkluːdɪd ɪn ðə praɪs/", "variants": [["Does the price include breakfast?", "更顺口，主动语态"], ["Is breakfast free?", "最简，但 free 不如 included 准确表达『含在房费里』"]], "scenes": [["订酒店问含早", "Is breakfast included?", "对方回 Yes, it's a buffet. / No, it's extra.(另收费) / Continental breakfast only.(仅欧式简早)"], ["顺带问是否含税/服务费", "Does it include tax and service?", "延展问法"], ["顺带问 wifi", "Is Wi-Fi included?", "一并确认网络"]], "grammar": "be included in + 名词 是被动结构，表『被包含在…里』；price 单数用 is。included /ɪnˈkluːdɪd/ 是 include 的过去分词作形容词。", "pron": "连读：Is breakfast→/ɪz ˈbrekfəst/（z 与 b 连读）；breakfast included→/ˈbrekfəst ɪnˈkluːdɪd/（t 与 ɪ 连读）；included in→/ɪnˈkluːdɪd ɪn/（d 与 ɪ）；in the→/ɪn ðə/（n 与 ð）。失去爆破：breakfast 词尾 /t/ 在 /ɪ/ 前为不完全爆破 /ˈbrekfəs(t) ɪn/；included 词尾 /d/ 在 /ɪn/ 前 /ɪnˈkluːdɪ(d) ɪn/。浊化：breakfast 词尾 t 在 ɪ 前快读可浊化为 d：/ˈbrekfəsd ɪn/。弱读：the→/ðə/；in→/ɪn/。同化/滑音/缩读：无典型。"}}, {"id": 8, "en": "Could you recommend a good local restaurant that's not too expensive and within walking distance?", "zh": "你能推荐一家不太贵、步行就能到的本地好餐厅吗？", "category": "餐厅/推荐", "theme": "travel", "mastery": 1, "introducedDay": 2, "keyvocab": [{"term": "recommend", "ipa": "/ˌrekəˈmend/", "pos": "v.", "zh": "推荐"}, {"term": "distance", "ipa": "/ˈdɪstəns/", "pos": "n.", "zh": "距离"}], "enh": {"fullIpa": "/kʊd ju ˌrekəˈmend ə ɡʊd ˈloʊkəl ˈrestərənt ðæts nɑːt tuː ɪkˈspensɪv ənd ˈwɪðɪn ˈwɔːkɪŋ ˈdɪstəns/", "variants": [["Any good local spots around here?", "spots = 地点，极口语"], ["Where do locals eat?", "问本地人去哪吃，更地道"], ["Do you know a place that won't break the bank?", "break the bank 俚语『花太多钱』"]], "scenes": [["问酒店前台", "Can you recommend a good restaurant nearby?", "对方直接给名字"], ["问路人", "Where's a nice place to eat around here?", "对方指路"], ["不同回答", "Try the place on 5th St. / It's a bit touristy.(偏游客) / Book ahead, it's popular.(要预定)"]], "grammar": "recommend 后接名词或动名词：recommend a restaurant / recommend going there。within walking distance 是固定搭配『步行范围内』；that's = that is 引导定语从句修饰 restaurant。", "pron": "同化：Could you→/kʊdʒu/（d+j 同化为 dʒ，关键！）；that's not→/ðæts nɑt/（s 与 n 相邻）。连读：good local→/ɡʊ wˈloʊkəl/（d 后加 w 滑音）；not too→/nɑ tʊ/（两个 t 只读一次，后接元音）；too expensive 顺接 /tuː ɪkˈspensɪv/；and within→/ənd ˈwɪðɪn/（d 与 w）。浊化：not too 快读 /nɑ dʊ/（t→d）。失去爆破：good local /ɡʊ(d) ˈloʊkəl/（d 在 l 前不完全爆破）。弱读：a→/ə/；and→/ən/；that's→/ðæts/。缩读：that's = that is（口语缩读）。闪音：无典型。"}}, {"id": 9, "en": "I was wondering if you'd like to grab a coffee with me sometime this week.", "zh": "我想问你这周有没有空跟我喝杯咖啡。", "category": "邀约/喝咖啡", "theme": "daily", "mastery": 1, "introducedDay": 2, "keyvocab": [{"term": "wondering", "ipa": "/ˈwʌndərɪŋ/", "pos": "v.", "zh": "想知道"}, {"term": "coffee", "ipa": "/ˈkɔfi/", "pos": "n.", "zh": "咖啡"}], "enh": {"fullIpa": "/aɪ wʌz ˈwʌndərɪŋ ɪf juːd laɪk tə ɡræb ə ˈkɔːfi wɪð miː ˈsʌmtaɪm ðɪs wiːk/", "variants": [["Want to get a coffee sometime?", "最口语，直接用 want"], ["Let's grab a coffee.", "已默认能成，更熟"], ["How about a coffee later?", "更轻的提议"]], "scenes": [["委婉邀约(不太熟)", "I was wondering if you'd like to…", "最礼貌，给对方余地"], ["熟人间", "Wanna grab a drink?", "drink 可含咖啡/酒，看语境"], ["不同回答", "Sure, Tuesday works. / I'd love to but I'm swamped.(想去但忙) / Rain check?(改天呗)"]], "grammar": "I was wondering if… 用过去进行时表委婉，比 Do you want 客气得多，是邀约神句。would like to = 想（礼貌）；grab 本义抓，口语常指『快速喝/吃一杯』。", "pron": "连读：was wondering→/wʌz ˈwʌndərɪŋ/（z 与 w）；grab a→/ɡræb ə/（b 与 a）；coffee with→/ˈkɔfi wɪð/（i 与 w 滑音）；sometime this→/ˈsʌmtaɪm ðɪs/（m 与 ð）。浊化：like to→/laɪ də/（t→d，同 wanna 规律）；grab a 中 b 保持浊。弱读：to→/tə/；a→/ə/；me→/mi/(可弱读 /mə/)；if→/ɪf/。缩读：you'd = you would（口语缩读）；场景中 wanna = want to。失去爆破：grab a /ɡræ(b) ə/（b 在 a 前轻微不完全爆破）。闪音：无典型。"}}, {"id": 10, "en": "I seem to have lost my way — could you tell me how to get to the city center from here?", "zh": "我好像迷路了，你能告诉我从这里怎么去市中心吗？", "category": "问路/迷路", "theme": "travel", "mastery": 1, "introducedDay": 2, "keyvocab": [{"term": "lost", "ipa": "/lɔst/", "pos": "adj.", "zh": "迷路的"}, {"term": "center", "ipa": "/ˈsɛntər/", "pos": "n.", "zh": "中心"}], "enh": {"fullIpa": "/aɪ siːm tə hæv lɔst maɪ weɪ kʊd ju tel miː haʊ tə ɡet tə ðə ˈsɪti ˈsentər frəm hɪr/", "variants": [["I'm lost.", "最简，最常用"], ["I think I'm lost.", "更柔和"], ["Can you help me find my way?", "直接请帮忙指路"]], "scenes": [["问路人", "Excuse me, I seem to have lost my way.", "对方指路或 Follow me.(跟我来)"], ["用手机", "Can you help me find this on Maps?", "请对方帮忙查地图"], ["不同回答", "Go back to the main road. / I'll walk you there. / You're going the wrong way.(你走反了)"]], "grammar": "I seem to have + 过去分词 表『我好像（已经）…了』，比 I'm lost 委婉。lost my way 固定搭配『迷路』；city center（英）/ downtown（美）都表市中心。", "pron": "同化：Could you→/kʊdʒu/（d+j 同化为 dʒ，关键！）。连读：seem to→/siːm p tə/（m 后加 p 滑音）；lost my→/lɔs maɪ/（t 与 m 连读）；my way→/maɪ weɪ/（aɪ 与 w 滑音）；from here→/frəm hɪr/（m 与 h）；tell me→/tɛl mi/（l 与 m）。浊化：lost my 快读 /lɔz maɪ/ 或 /lɔd maɪ/（t→d，典型）；have 的 v 保持浊。失去爆破：lost my /lɔ(s)t maɪ/（s-t，/t/ 在 m 前不完全爆破）；get to /ɡe(t) tə/；center /ˈsɛn(t)ər/（t 在 ər 前不完全爆破）。闪音：city→/ˈsɪɾi/（美式，元音间 /t/ 标闪音 /ɾ/，关键！）。弱读：to→/tə/；the→/ðə/。缩读：无典型。"}}, {"id": 11, "en": "Where can I buy a ticket to the city center?", "zh": "我在哪里可以买到去市中心的票？", "category": "交通/购票", "theme": "travel", "mastery": 1, "introducedDay": 5, "keyvocab": [{"term": "ticket", "ipa": "/ˈtɪkɪt/", "pos": "n.", "zh": "票"}, {"term": "city", "ipa": "/ˈsɪti/", "pos": "n.", "zh": "城市"}], "enh": {"fullIpa": "/wɛr kən aɪ baɪ ə ˈtɪkɪt tə ðə ˈsɪti ˈsɛntər/", "variants": [["Where do I get a ticket to downtown?", "downtown 是美式『市中心』"], ["Can I buy a ticket here?", "问当场/本地能否买票"], ["One ticket to the center, please.", "窗口极简说法"]], "scenes": [["问售票柜台", "Where can I buy a ticket to the city center?", "对方指柜台 Over there at the counter."], ["问自助机", "Is there a ticket machine around here?", "对方回 Yes, by the entrance."], ["不同回答", "Single or return? / It's 3 dollars. / Platform 2 is that way."]], "grammar": "Where can I + 动词原形 用于询问地点/请求信息；buy a ticket to + 地点 表『买去…的票』。city center（英）/ downtown（美）同义。ticket 单数即可泛指『一张票』。", "pron": "连读：Where can→/wɛr kən/（r 与 k）；can I→/kə naɪ/（n 与 a）；buy a→/baɪ ə/（aɪ 与 ə）；ticket to→/ˈtɪkɪ tə/（t 与 tə）；to the→/tə ðə/。弱读：can→/kən/；a→/ə/；to→/tə/；the→/ðə/。失去爆破：ticket /ˈtɪkɪ(t)/（词尾 t 轻微不完全爆破）；center /ˈsɛn(t)ər/（t 在 ər 前）。闪音：city→/ˈsɪɾi/（美式元音间 t 标闪音 /ɾ/，关键！）。同化/滑音/浊化/缩读：无典型。"}}, {"id": 12, "en": "How long does it take to get there?", "zh": "到那里要花多长时间？", "category": "交通/时长", "theme": "travel", "mastery": 1, "introducedDay": 5, "keyvocab": [{"term": "take", "ipa": "/teɪk/", "pos": "v.", "zh": "花费（时间）"}, {"term": "there", "ipa": "/ðɛr/", "pos": "adv.", "zh": "那里"}], "enh": {"fullIpa": "/haʊ lɔŋ dʌz ɪt teɪk tə ɡɛt ðɛr/", "variants": [["How long is the trip?", "问行程时长，trip 更口语"], ["How long will it take?", "将来时，问预计多久"], ["About how long?", "极简追问大约多久"]], "scenes": [["问交通时长", "How long does it take to get there?", "对方回 About 20 minutes by bus."], ["不同交通对比", "Is the train faster than the bus?", "问哪种更快"], ["不同回答", "It's a 10-minute walk. / Around an hour. / Depends on traffic."]], "grammar": "How long 问时长；It takes + 时间 + to do 是『做某事花多少时间』的固定句型，does 随主语 it 用单数。get there = 到达那里，there 作副词不加 to。", "pron": "连读：How long→/haʊ lɔŋ/（w 与 l）；does it→/dʌ zɪt/（z 与 ɪ）；it take→/ɪ tteɪk/（t 与 t 顺接）；take to→/teɪk tə/；get there→/ɡɛ tðɛr/（t 与 ð）。弱读：does→/dəz/；it→/ɪt/；to→/tə/。失去爆破：get there /ɡɛ(t) ðɛr/（t 在 ð 前不完全爆破）。浊化：无典型。同化/滑音/闪音/缩读：无典型。"}}, {"id": 13, "en": "Is this seat taken?", "zh": "这个座位有人坐吗？", "category": "交通/座位", "theme": "travel", "mastery": 1, "introducedDay": 5, "keyvocab": [{"term": "seat", "ipa": "/sit/", "pos": "n.", "zh": "座位"}, {"term": "taken", "ipa": "/ˈteɪkən/", "pos": "adj.", "zh": "被占用的"}], "enh": {"fullIpa": "/ɪz ðɪs sit ˈteɪkən/", "variants": [["Is anyone sitting here?", "问『有人坐这儿吗』更直白"], ["Is this taken?", "极简，指座位/物品"], ["Can I sit here?", "直接问能否坐"]], "scenes": [["车上找座", "Excuse me, is this seat taken?", "对方回 No, go ahead.(没人，请坐) / Yes, sorry.(有人)"], ["放行李", "Is this spot free?", "问地方是否被占"], ["不同回答", "It's free. / Someone's coming back. / I'm saving it for a friend."]], "grammar": "be + 过去分词 表状态；take 的过去分词 taken 在此作形容词『被占用的』。this seat 单数用 is。比 Can I sit here 更礼貌且常用。", "pron": "连读：Is this→/ɪz ðɪs/（z 与 ð）；this seat→/ðɪs sit/（s 与 s）；seat taken→/sit ˈteɪkən/（t 与 t）。弱读：this→/ðɪs/（此处重读）；is→/ɪz/。失去爆破：this seat /ðɪ(s) sit/（s 轻微）；seat taken /si(t) ˈteɪkən/（t 在 t 前不完全爆破）。浊化：无。同化/滑音/闪音/缩读：无典型。"}}, {"id": 14, "en": "I'd like a window seat, please.", "zh": "我想要一个靠窗的座位，谢谢。", "category": "机场/选座", "theme": "travel", "mastery": 4, "introducedDay": 5, "keyvocab": [{"term": "window", "ipa": "/ˈwɪndoʊ/", "pos": "n.", "zh": "窗户"}, {"term": "seat", "ipa": "/sit/", "pos": "n.", "zh": "座位"}], "enh": {"fullIpa": "/aɪd laɪk ə ˈwɪndoʊ sit pliz/", "variants": [["I'd like an aisle seat, please.", "aisle=靠走道座位"], ["Window seat, please.", "极简，值机时说"], ["Can I get a window seat?", "问能否安排靠窗"]], "scenes": [["值机选座", "I'd like a window seat, please.", "对方回 Sure, 14A by the window."], ["在线选座", "Is a window seat still available?", "问是否还有靠窗位"], ["不同回答", "We only have middle seats left. / Aisle okay instead? / No extra charge."]], "grammar": "I'd like to… / I'd like + 名词 表『我想要…』，比 I want 礼貌。window seat / aisle seat 是航班选座固定说法。", "pron": "缩读：I'd = I would（/aɪd/，'d 为 would 缩读）。连读：like a→/laɪ kə/（k 与 ə）；a window→/ə ˈwɪndoʊ/；window seat→/ˈwɪndoʊ sit/（oʊ 与 s）；seat please→/sit pliz/（t 与 p）。弱读：a→/ə/。失去爆破：window seat /ˈwɪndoʊ(s) sit/（w 轻微）；seat please /si(t) pliz/（t 在 p 前不完全爆破）。浊化：无典型。同化/滑音/闪音：无典型。"}}, {"id": 15, "en": "Where is the baggage claim?", "zh": "行李领取处在哪里？", "category": "机场/行李", "theme": "travel", "mastery": 1, "introducedDay": 5, "keyvocab": [{"term": "baggage", "ipa": "/ˈbæɡɪdʒ/", "pos": "n.", "zh": "行李"}, {"term": "claim", "ipa": "/kleɪm/", "pos": "n.", "zh": "领取"}], "enh": {"fullIpa": "/wɛr ɪz ðə ˈbæɡɪdʒ kleɪm/", "variants": [["Where do I pick up my luggage?", "pick up luggage 更口语"], ["Where's the luggage carousel?", "carousel=行李转盘"], ["Baggage claim?", "极简，问路时"]], "scenes": [["机场找行李", "Excuse me, where is the baggage claim?", "对方指方向 This way, follow the signs."], ["看屏幕", "Which carousel is for flight XX?", "问几号转盘"], ["不同回答", "It's downstairs. / Belt 3 on the left. / Turn right after customs."]], "grammar": "baggage 与 luggage 都表行李，baggage 偏美、luggage 通用且不可数。claim 此处作名词『领取处』；Where is + 地点 问位置。", "pron": "连读：Where is→/wɛə rɪz/（r 与 ɪ）；is the→/ɪ zðə/（z 与 ð）；the baggage→/ðə ˈbæɡɪdʒ/；baggage claim→/ˈbæɡɪdʒ kleɪm/（dʒ 与 k）。弱读：is→/ɪz/；the→/ðə/。失去爆破：baggage /ˈbæɡɪ(dʒ)/ 词尾轻微；无相邻爆破典型。浊化：无典型。同化/滑音/闪音/缩读：无典型。"}}, {"id": 16, "en": "My luggage didn't arrive.", "zh": "我的行李没有到。", "category": "机场/行李", "theme": "travel", "mastery": 0, "introducedDay": 6, "keyvocab": [{"term": "luggage", "ipa": "/ˈlʌɡɪdʒ/", "pos": "n.", "zh": "行李"}, {"term": "arrive", "ipa": "/əˈraɪv/", "pos": "v.", "zh": "到达"}], "enh": {"fullIpa": "/maɪ ˈlʌɡɪdʒ ˈdɪdənt əˈraɪv/", "variants": [["My bag didn't come out.", "come out 指『没出来』更口语"], ["My suitcase is missing.", "suitcase 指行李箱"], ["Where's my luggage?", "直接问行李在哪"]], "scenes": [["行李未到", "My luggage didn't arrive.", "对方让你填表 File a lost baggage report."], ["找工作人员", "Can you check where my bag is?", "请查行李去向"], ["不同回答", "It's on the next flight. / Please fill this form. / We'll deliver it to your hotel."]], "grammar": "一般过去时 didn't + 动词原形 arrive（注意否定后接原形，不说 arrived）。luggage 不可数，my luggage 单数。missing / lost 表『遗失的』。", "pron": "缩读：didn't = did not（/ˈdɪdənt/）。连读：My luggage→/maɪ ˈlʌɡɪdʒ/（aɪ 与 l）；luggage didn't→/ˈlʌɡɪdʒ ˈdɪdənt/（dʒ 与 d）；didn't arrive→/ˈdɪdənt əˈraɪv/（t 与 ə）。弱读：my→/maɪ/（重读）；didn't 弱读 /ˈdɪdənt/。失去爆破：luggage didn't /ˈlʌɡɪ(dʒ) ˈdɪ/（dʒ 轻微）；didn't arrive /ˈdɪdən(t) ə/（t 在 ə 前不完全爆破）。浊化：无。同化/滑音/闪音：无典型。"}}, {"id": 17, "en": "Do I need a visa for this country?", "zh": "去这个国家需要签证吗？", "category": "出入境/签证", "theme": "travel", "mastery": 1, "introducedDay": 6, "keyvocab": [{"term": "visa", "ipa": "/ˈvizə/", "pos": "n.", "zh": "签证"}, {"term": "country", "ipa": "/ˈkʌntri/", "pos": "n.", "zh": "国家"}], "enh": {"fullIpa": "/du aɪ nid ə ˈvizə fɔr ðɪs ˈkʌntri/", "variants": [["Do I need a visa to enter?", "enter 强调『入境』"], ["Is a visa required here?", "被动，更正式"], ["Do you need a visa for X?", "问别人是否需要"]], "scenes": [["查签证要求", "Do I need a visa for this country?", "对方回 Citizens of your country do. / No, visa-free for 30 days."], ["问落地签", "Can I get a visa on arrival?", "问能否落地办"], ["不同回答", "You need to apply online. / Just bring your passport. / It's visa-free."]], "grammar": "Do I need + 名词/不定式 问『我是否需要…』；for + 国家 表『去某国』。visa 单数可数，a visa。required 是 require 过去分词作形容词。", "pron": "连读：Do I→/du aɪ/（u 与 a）；I need→/aɪ nid/（aɪ 与 n）；need a→/nid ə/（d 与 ə）；visa for→/ˈvizə fɔr/（ə 与 f）；for this→/fɔr ðɪs/（r 与 ð）。弱读：do→/də/；a→/ə/；for→/fər/。失去爆破：need a /ni(d) ə/（d 在 ə 前不完全爆破）。浊化：need a 快读 /ni də/（d 本就浊）。同化/滑音/闪音/缩读：无典型。"}}, {"id": 18, "en": "Where should I go for passport control?", "zh": "我该去哪里办护照查验？", "category": "机场/出入境", "theme": "travel", "mastery": 1, "introducedDay": 6, "keyvocab": [{"term": "passport", "ipa": "/ˈpæspɔrt/", "pos": "n.", "zh": "护照"}, {"term": "control", "ipa": "/kənˈtroʊl/", "pos": "n.", "zh": "检查，管制"}], "enh": {"fullIpa": "/wɛr ʃʊd aɪ ɡoʊ fɔr ˈpæspɔrt kənˈtroʊl/", "variants": [["Where's passport control?", "极简问法"], ["Which way to immigration?", "immigration 指入境查验"], ["Is this the line for passport control?", "问是否排对队"]], "scenes": [["机场入境", "Where should I go for passport control?", "对方指 Go straight, then turn left."], ["转机", "Do I need to go through passport control?", "问是否要过关"], ["不同回答", "Follow the signs. / It's on the second floor. / This line is for transfers."]], "grammar": "should 表『应该』，Where should I go… 礼貌询问去向。for + 名词 表『为了…（的事）』。passport control 是固定搭配『护照查验/出入境检查』。", "pron": "连读：Where should→/wɛr ʃʊd/（r 与 ʃ）；should I→/ʃʊ daɪ/（d 与 a）；I go→/aɪ ɡoʊ/；go for→/ɡoʊ fɔr/；for passport→/fɔr ˈpæspɔrt/；passport control→/ˈpæspɔrt kənˈtroʊl/（t 与 k）。弱读：should→/ʃʊd/；I→/aɪ/；for→/fər/。失去爆破：passport /ˈpæs(p)ɔrt/（s-p 相邻，p 轻）；should I /ʃʊ(d) aɪ/。浊化：passport 中 p 在 s 后保持清。同化/滑音/闪音/缩读：无典型。"}}, {"id": 19, "en": "Could you call me a taxi, please?", "zh": "你能帮我叫辆出租车吗？", "category": "交通/打车", "theme": "travel", "mastery": 1, "introducedDay": 6, "keyvocab": [{"term": "taxi", "ipa": "/ˈtæksi/", "pos": "n.", "zh": "出租车"}, {"term": "call", "ipa": "/kɔl/", "pos": "v.", "zh": "叫，打电话"}], "enh": {"fullIpa": "/kʊd ju kɔl mi ə ˈtæksi pliz/", "variants": [["Can you get me a taxi?", "get me a taxi 更口语"], ["I need a cab, please.", "cab = taxi 美式口语"], ["Please call a cab for me.", "请代叫车"]], "scenes": [["酒店代叫车", "Could you call me a taxi, please?", "对方回 Sure, I'll get one now."], ["路边拦车", "Can you wave down a taxi?", "请招手拦车"], ["不同回答", "It'll be here in 5 minutes. / App-based only here. / Where to, sir?"]], "grammar": "Could you + 动词原形 委婉请求；call me a taxi 是双宾语结构（call + 间接宾语 me + 直接宾语 a taxi）。taxi / cab 同义，cab 更口语。", "pron": "同化：Could you→/kʊdʒu/（d+j 同化为 dʒ，关键！）。连读：call me→/kɔl mi/（l 与 m）；me a→/mi ə/（i 与 ə）；a taxi→/ə ˈtæksi/。弱读：me→/mi/；a→/ə/。失去爆破：call me /kɔ(l) mi/（l 轻微）；无相邻爆破典型。浊化：无。滑音/闪音/缩读：无典型。"}}, {"id": 20, "en": "Please drop me off at the train station.", "zh": "请在火车站让我下车。", "category": "交通/打车", "theme": "travel", "mastery": 1, "introducedDay": 6, "keyvocab": [{"term": "drop", "ipa": "/drɑp/", "pos": "v.", "zh": "放下，卸下"}, {"term": "station", "ipa": "/ˈsteɪʃən/", "pos": "n.", "zh": "车站"}], "enh": {"fullIpa": "/pliz drɑp mi ɔf ət ðə treɪn ˈsteɪʃən/", "variants": [["Drop me off at the station, please.", "省略 train 也懂"], ["Can you stop at the train station?", "stop 表『停车』"], ["I'll get off at the station.", "get off 表下车"]], "scenes": [["打车报目的地", "Please drop me off at the train station.", "司机回 Sure. / Got it."], ["提前提醒", "Could you let me know when we're close?", "请快到提醒"], ["不同回答", "Here we are. / That's 12 dollars. / Watch your step."]], "grammar": "drop off 短语动词『让…下车/卸下』，宾语为代词时必放中间：drop me off。at + 车站 表地点。train station / subway station 表车站。", "pron": "连读：drop me→/drɑp mi/（p 与 m）；me off→/mi ɔf/（i 与 ɔ）；off at→/ɔ fæt/（f 与 æ）；at the→/ət ðə/；the train→/ðə treɪn/；train station→/treɪn ˈsteɪʃən/（n 与 s）。弱读：me→/mi/；at→/ət/；the→/ðə/。失去爆破：drop me /drɑ(p) mi/（p 在 m 前不完全爆破）；train station /treɪ(n) ˈsteɪ/（n 轻微）。浊化：无。同化/滑音/闪音：无典型。缩读：无。"}}];
(function(){
  const grid = document.getElementById('grid');
