<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语口语 Day 1 · 增强版</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --text:#1f2329; --sub:#6b7280;
    --line:#e5e7eb; --accent:#2f6fed; --accent2:#0e9f6e; --warn:#b45309; --pron:#0369a1;
    --travel:#eef4ff; --daily:#eafaf3; --chip:#fff4e5;
    --var:#f3f0ff; --scene:#eafaf3; --gram:#fff7ed; --pr:#eaf4ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.65;padding:24px 16px 60px}
  .wrap{max-width:820px;margin:0 auto}
  header{text-align:center;margin-bottom:14px}
  header h1{font-size:22px;font-weight:700}
  header p{color:var(--sub);font-size:13.5px;margin-top:6px}
  .legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:6px 0 18px}
  .legend b{color:var(--text)}
  .toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 22px}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;
    padding:7px 16px;font-size:14px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .sec-title{font-size:15px;font-weight:700;color:var(--sub);margin:24px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title .tag{background:var(--accent);color:#fff;font-size:12px;padding:2px 9px;border-radius:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .pill{font-size:12px;padding:2px 10px;border-radius:999px;font-weight:600}
  .pill.travel{background:var(--travel);color:#2f6fed}
  .pill.daily{background:var(--daily);color:#0e9f6e}
  .play{margin-left:auto;display:flex;gap:6px}
  .ic{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:30px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
  .ic:hover{border-color:var(--accent);background:#f0f6ff}
  .en{font-size:19px;font-weight:600;letter-spacing:.2px}
  .ipa{color:var(--sub);font-size:13px;margin:4px 0 6px;font-style:italic}
  .zh{font-size:15px;color:#374151}
  .block{margin-top:12px;border-radius:10px;padding:10px 12px;font-size:13.5px}
  .block .h{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .var{background:var(--var)} .scene{background:var(--scene)} .gram{background:var(--gram)} .pr{background:var(--pr)}
  .var .h{color:#6d28d9} .scene .h{color:#0e9f6e} .gram .h{color:var(--warn)} .pr .h{color:var(--pron)}
  .kw{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .kw .chip{background:var(--chip);border-radius:8px;padding:5px 10px;font-size:13px}
  .kw .chip b{color:#b45309} .kw .chip .p{color:#9a3412;font-style:italic;margin-left:4px}
  .block ul{margin:0;padding-left:18px} .block li{margin:3px 0}
  .scene li .occ{color:#0e9f6e;font-weight:600} .scene li .resp{color:#6b7280}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗣 英语口语 · Day 1（增强版）</h1>
    <p>旅游 + 日常混合 · 7 短句 + 3 长句 · 中英对照 + 生词音标 + 原声伴读 + 变体 + 场景俚语 + 语法 + 发音提示</p>
  </header>
  <div class="legend">
    <span>🔹 <b>简化/口语变体</b></span>
    <span>🎭 <b>场景化表达 + 不同回答</b></span>
    <span>📝 <b>语法提示</b></span>
    <span>🔤 <b>发音提示(连读/浊化)</b></span>
  </div>
  <div class="toolbar">
    <button class="btn primary" onclick="playAll()">▶ 全部伴读</button>
    <button class="btn" id="slowBtn" onclick="toggleSlow()">🐢 慢速：关</button>
    <button class="btn" onclick="stopAll()">⏹ 停止</button>
  </div>

  <div class="sec-title"><span class="tag">短句</span> Short sentences（7）</div>
  <div id="short"></div>
  <div class="sec-title"><span class="tag">长句</span> Long sentences（3）</div>
  <div id="long"></div>

  <footer>每天 10:00 自动推送新一批（同款增强版）· 进度本地保存，不外传</footer>
</div>

<script>
const DATA = [
 {id:"s1",type:"short",topic:"travel",en:"Where is the nearest subway station?",ipa:"/wɛr ɪz ðə ˈnɪrɪst ˈsʌbweɪ ˈsteɪʃən/",zh:"最近的地铁站在哪里？",
  kw:[["subway","/ˈsʌbweɪ/","n.地铁"],["nearest","/ˈnɪrɪst/","adj.最近的"]],
  variants:[["Where's the nearest metro station?","更口语，metro 在欧陆常用"],["Which way to the subway?","极简指路问法"]],
  scenes:[["问路人/酒店前台","Where's the nearest subway station?","对方指路或说 Go straight and turn left."],["请对方在地图上标","Can you pin the station on my map?","对方帮你定位"],["分不清地铁叫法","Is it the tube or the metro here?","英式 tube / 美式 subway / 欧陆 metro"]],
  grammar:"nearest 是 near 的最高级，the nearest + 名词 = 最近的…。subway（美）/ underground（英）/ metro（欧陆）同义，到当地用当地词更地道。",
  pron:"连读：Where is→/wɛə rɪz/（r 连读）；is the→/ɪ zðə/（z 与 ð 连读）；the nearest 元音顺接。浊化：无典型。"},

 {id:"s2",type:"short",topic:"daily",en:"Could you say that again, please?",ipa:"/kʊd ju seɪ ðæt əˈɡɛn pliz/",zh:"你能再说一遍吗？",
  kw:[["again","/əˈɡɛn/","adv.再次"]],
  variants:[["Say that again?","轻松，朋友间"],["What? / Huh?","很随意，仅限熟人，慎对长辈/客户"],["Come again?","地道口语，偏英式"]],
  scenes:[["英式日常","Sorry? / Pardon?","英式最地道，朋友间"],["美式日常","Excuse me? / What was that?","美式更自然，不易误会"],["职场/客服","Could you repeat that, please?","比 say again 更职业"],["电话听不清","Sorry, I didn't catch that. / You're breaking up.","信号差时"]],
  grammar:"Could you + 动词原形 比 Can you 更礼貌（could 表委婉，不是过去式）。say 过去式是 said，但 say that again 用原形；again 重音在第二音节 /əˈɡɛn/。",
  pron:"连读/同化：Could you→/kʊdʒu/（d+j 同化为 dʒ，关键！）；that again→/ðæ təˈɡɛn/（t 与 a 连读）。浊化：that again 快读 t→d：/ðæ dəˈɡɛn/。"},

 {id:"s3",type:"short",topic:"travel",en:"I'd like to book a table for two.",ipa:"/aɪd laɪk tə bʊk ə ˈteɪbəl fɔr tu/",zh:"我想订一张两人桌。",
  kw:[["book","/bʊk/","v.预订"],["table","/ˈteɪbəl/","n.餐桌"]],
  variants:[["I'd like to reserve a table for two.","reserve 更正式，餐厅常用"],["Table for two, please.","极简，前台直接说"]],
  scenes:[["电话订位","I'd like to book a table for two at 7.","加时间；对方回 Sure, window or inside?"],["现场有没有位","Do you have a table for two?","对方回 It's fully booked.(满座) / Your name, please?"],["等位","Can we put our name down?","留名等位"]],
  grammar:"I'd like to… = I would like to…，比 I want 礼貌，点单/预订万能句。book/reserve 在餐厅酒店都表预订；for two 表两人份。",
  pron:"连读：like to→/laɪk tə/（可连成 /laɪktə/）；book a→/bʊ kə/（k 与 a 连读）；table for→/ˈteɪbə wɔr/（l 后加 w 滑音）。浊化：like to 快读 t→d：/laɪ də/。"},

 {id:"s4",type:"short",topic:"daily",en:"It's nice to meet you.",ipa:"/ɪts naɪs tə miːt ju/",zh:"很高兴认识你。",
  kw:[["meet","/miːt/","v.结识，遇见"]],
  variants:[["Nice to meet you.","省略 It's，最常用"],["Great to meet you.","更热情"],["Pleasure to meet you.","偏正式/商务"]],
  scenes:[["初次见面","Nice to meet you.","对方回 Nice to meet you too."],["经人介绍","This is my friend Tom. — Nice to meet you, Tom.","带名字更自然"],["道别时","Hope to see you again.","期待再见"]],
  grammar:"It's + adj. + to do 是形式主语结构；meet 过去式 met，但寒暄用原形 meet。回句固定加 too（也很高兴认识你）。",
  pron:"连读：It's nice→/ɪ tsnaɪs/（ts 连读）；nice to→/naɪs tə/（s 与 t 连读）；to meet→/tə wmiːt/（加 w 滑音）；meet you→/miː tʃu/（t+j 同化为 tʃ，关键！）。浊化：无典型。"},

 {id:"s5",type:"short",topic:"travel",en:"How much does this cost?",ipa:"/haʊ mʌtʃ dʌz ðɪs kɔst/",zh:"这个多少钱？",
  kw:[["cost","/kɔst/","v.花费 n.费用"]],
  variants:[["How much is this?","最简，口语最常用"],["What's the price?","偏正式"],["How much are these?","复数/多个时"]],
  scenes:[["砍价前问价","How much is it?","对方报价，可接 That's a bit much.(有点贵)"],["问单位价","How much per kilo / each?","按斤/个计价"],["自由市场","Is the price negotiable?","问能否议价"]],
  grammar:"How much + do/does + 主语 + cost? cost 此处作动词花费；this 单数用 does。口语更常省去 cost 直接说 How much is this?",
  pron:"连读：How much→/haʊ mʌtʃ/（w 与 m 连读）；much does→/mʌtʃ dʌz/（tʃ 与 d）；does this→/dʌz ðɪs/（z 与 ð）。浊化：this cost 中 s 后接清 k，保持清音。"},

 {id:"s6",type:"short",topic:"daily",en:"What do you usually do on weekends?",ipa:"/wʌt du ju ˈjuːʒuəli du ɑːn ˈwiːkendz/",zh:"你周末通常做什么？",
  kw:[["usually","/ˈjuːʒuəli/","adv.通常"],["weekends","/ˈwiːkendz/","n.周末"]],
  variants:[["What do you do on weekends?","省 usually，仍自然"],["Any plans for the weekend?","问周末有安排吗，更闲聊"],["How do you usually spend your weekends?","稍正式"]],
  scenes:[["破冰闲聊","What do you usually do on weekends?","对方答 I usually… / Not much."],["约人","Do you wanna hang out this weekend?","wanna = want to，想一起玩吗"],["不同回答","I just chill at home. / I go hiking. / Work, unfortunately.","宅 / 徒步 / 无奈要加班"]],
  grammar:"一般现在时表习惯；usually 放主语和动词之间（do you usually do）。周末：on weekends（美）/ at weekends（英）。",
  pron:"连读：do you→/dʒu/（d+j 同化为 dʒ，关键！）；do on→/dʊ wɑn/（加 w 滑音）。浊化：What do→/wʌ dʊ/（t→d 浊化，极典型）；usually do 顺接。"},

 {id:"s7",type:"short",topic:"travel",en:"Is breakfast included in the price?",ipa:"/ɪz ˈbrekfəst ɪnˈkluːdɪd ɪn ðə praɪs/",zh:"房价包含早餐吗？",
  kw:[["breakfast","/ˈbrekfəst/","n.早餐"],["included","/ɪnˈkluːdɪd/","adj.包含在内的"]],
  variants:[["Does the price include breakfast?","更顺口"],["Is breakfast free?","最简，但不如 included 准确"]],
  scenes:[["订酒店","Is breakfast included?","对方回 Yes, it's a buffet. / No, it's extra.(另收费) / Continental breakfast only.(仅欧式简早)"],["含不含税/服务费","Does it include tax and service?","延展问法"],["含不含 wifi","Is Wi-Fi included?","顺带一问"]],
  grammar:"be included in + 名词 是被动结构，表被包含在…里；price 单数用 is。included /ɪnˈkluːdɪd/ 是 include 的过去分词作形容词。",
  pron:"连读：Is breakfast→/ɪz ˈbrekfəst/（z 与 b）；breakfast included→/ˈbrekfəst ɪnˈkluːdɪd/（t 与 ɪ）；included in→/ɪnˈkluːdɪd ɪn/（d 与 ɪ）。浊化：breakfast 词尾 t 在 ɪ 前快读可浊化为 d。"},

 {id:"s8",type:"long",topic:"travel",en:"Could you recommend a good local restaurant that's not too expensive and within walking distance?",ipa:"/kʊd ju ˌrekəˈmend ə ɡʊd ˈloʊkəl ˈrestərənt ðæts nɑːt tuː ɪkˈspensɪv ənd ˈwɪðɪn ˈwɔːkɪŋ ˈdɪstəns/",zh:"你能推荐一家不太贵、步行就能到的本地好餐厅吗？",
  kw:[["recommend","/ˌrekəˈmend/","v.推荐"],["expensive","/ɪkˈspensɪv/","adj.昂贵的"],["within walking distance","/wɪðˈɪn ˈwɔːkɪŋ ˈdɪstəns/","步行范围内"]],
  variants:[["Any good local spots around here?","spots = 地点，极口语"],["Where do locals eat?","问本地人去哪吃，更地道"]],
  scenes:[["问酒店前台","Can you recommend a good restaurant nearby?","对方给名字"],["问路人","Where's a nice place to eat around here?","对方指路"],["不同回答","Try the place on 5th St. / It's a bit touristy.(偏游客) / Book ahead, it's popular.(要预定)"]],
  grammar:"recommend 后接名词或动名词：recommend a restaurant / recommend going there。within walking distance 固定搭配步行范围内；that's = that is 引导从句。",
  pron:"连读：Could you→/kʊdʒu/（d+j→dʒ）；good local→/ɡʊ wˈloʊkəl/（d 后加 w）；that's not→/ðæts nɑt/（s 与 n）；not too→/nɑ tʊ/（两个 t 只读一次）；too expensive 连读。浊化：not too 快读 /nɑ dʊ/（t→d）。"},

 {id:"s9",type:"long",topic:"daily",en:"I was wondering if you'd like to grab a coffee with me sometime this week.",ipa:"/aɪ wʌz ˈwʌndərɪŋ ɪf juːd laɪk tə ɡræb ə ˈkɔːfi wɪð miː ˈsʌmtaɪm ðɪs wiːk/",zh:"我想问你这周有没有空跟我喝杯咖啡。",
  kw:[["wondering","/ˈwʌndərɪŋ/","v.想知道(wonder分词)"],["grab","/ɡræb/","v.这里指「喝」"],["coffee","/ˈkɔːfi/","n.咖啡"]],
  variants:[["Want to get a coffee sometime?","最口语，直接 want"],["Let's grab a coffee.","已默认答应，更熟"]],
  scenes:[["委婉邀约(不太熟)","I was wondering if you'd like to…","最礼貌"],["熟人间","Wanna grab a drink?","drink 可含咖啡/酒，看语境"],["不同回答","Sure, Tuesday works. / I'd love to but I'm swamped.(想去但忙) / Rain check?(改天)"]],
  grammar:"I was wondering if… 用过去进行表委婉，比 Do you want 客气得多，邀约神句。would like to = 想（礼貌）；grab 本义抓，口语常指快速喝/吃。",
  pron:"连读：was wondering→/wʌz ˈwʌndərɪŋ/（z 与 w）；grab a→/ɡræb ə/（b 与 a）；coffee with→/ˈkɔfi wɪð/（i 与 w）；sometime this→/ˈsʌmtaɪm ðɪs/（m 与 ð）。浊化：like to→/laɪ də/（t→d，同 wanna 规律）。"},

 {id:"s10",type:"long",topic:"travel",en:"I seem to have lost my way — could you tell me how to get to the city center from here?",ipa:"/aɪ siːm tə hæv lɔst maɪ weɪ kʊd ju tel miː haʊ tə ɡet tə ðə ˈsɪti ˈsentər frəm hɪr/",zh:"我好像迷路了，你能告诉我从这里怎么去市中心吗？",
  kw:[["lost my way","/lɔst maɪ weɪ/","迷路"],["city center","/ˈsɪti ˈsentər/","市中心"]],
  variants:[["I'm lost.","最简，最常用"],["I think I'm lost.","更柔和"]],
  scenes:[["问路人","Excuse me, I seem to have lost my way.","对方指路或 Follow me.(跟我来)"],["用手机","Can you help me find this on Maps?","请对方帮忙查地图"],["不同回答","Go back to the main road. / I'll walk you there. / You're going the wrong way.(你走反了)"]],
  grammar:"I seem to have + 过去分词 表我好像（已经）…了，比 I'm lost 委婉。lost my way 固定搭配迷路；city center（英）/ downtown（美）都表市中心。",
  pron:"连读：seem to→/siːm p tə/（m 后加 p 滑音）；lost my→/lɔs maɪ/（t 与 m）；my way→/maɪ weɪ/（aɪ 与 w）；could you→/kʊdʒu/；from here→/frəm hɪr/。浊化：lost my→/lɔz maɪ/ 或 /lɔd maɪ/（t→d，典型）；have 的 v 保持浊。"}
];

let slow=false;
function toggleSlow(){ slow=!slow; document.getElementById('slowBtn').textContent='🐢 慢速：'+(slow?'开':'关'); }
function cardHTML(d){
  const kw=d.kw.map(k=>`<span class="chip"><b>${k[0]}</b><span class="p">${k[1]}</span> ${k[2]}</span>`).join('');
  const v=d.variants.map(x=>`<li><span class="ex">${x[0]}</span> <span class="nt">— ${x[1]}</span></li>`).join('');
  const sc=d.scenes.map(x=>`<li><span class="occ">【${x[0]}】</span> ${x[1]} <span class="resp">→ ${x[2]}</span></li>`).join('');
  return `<div class="card">
    <div class="top">
      <span class="num">${d.id.replace('s','')}</span>
      <span class="pill ${d.topic}">${d.topic==='travel'?'旅游':'日常'}</span>
      <span class="play">
        <span class="ic" title="原声伴读" onclick="playAudio('${d.id}')">🔊</span>
        <span class="ic" title="慢速朗读" onclick="playAudio('${d.id}', 0.75)">🐢</span>
      </span>
    </div>
    <div class="en">${d.en}</div>
    <div class="ipa">${d.ipa}</div>
    <div class="zh">${d.zh}</div>
    <div class="kw">${kw}</div>
    <div class="block var"><div class="h">🔹 简化 / 口语变体</div><ul>${v}</ul></div>
    <div class="block scene"><div class="h">🎭 场景化表达 + 不同回答</div><ul>${sc}</ul></div>
    <div class="block gram"><div class="h">📝 语法提示</div><div>${d.grammar}</div></div>
    <div class="block pr"><div class="h">🔤 发音提示（连读 / 同化 / 浊化）</div><div>${d.pron}</div></div>
  </div>`;
}
document.getElementById('short').innerHTML=DATA.filter(d=>d.type==='short').map(cardHTML).join('');
document.getElementById('long').innerHTML=DATA.filter(d=>d.type==='long').map(cardHTML).join('');

function playAudio(id, rate){ const a=new Audio('audio/'+id+'.mp3'); a.playbackRate=rate||1; a.play().catch(e=>console.warn('audio fail',id,e)); }
let queue=[]; function playAll(){ stopAll(); queue=DATA.map(d=>d.id); next(); }
function next(){ if(!queue.length){ stopAll(); return; } const id=queue.shift(); const a=new Audio('audio/'+id+'.mp3'); a.playbackRate=slow?0.75:1; a.onended=next; a.play().catch(()=>next()); }
function stopAll(){ queue=[]; }
</script>
</body>
</html>
